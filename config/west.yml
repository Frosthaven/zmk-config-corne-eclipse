manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: frosthaven
      url-base: https://github.com/Frosthaven
    - name: aym1607
      url-base: https://github.com/AYM1607
    - name: petejohanson
      url-base: https://github.com/petejohanson
  projects:
    - name: zmk
      remote: frosthaven
      # Pinned to an exact commit (not the branch): CI caches west modules keyed
      # on west.yml's hash, so a new branch commit would be served stale. Bump
      # this SHA on every ZMK-fork change. (= v0.3-peripheral-charging-bit HEAD)
      # d5963f2: smart-idle char ordered before the input-split chars + central
      # records its write handle without subscribing to NOTIFY -> fixes the
      # central->peripheral idle-activity sync on trackpad-on-peripheral builds.
      revision: d5963f25d6b314657694294792f61cb0ee90bfab
      import: app/west.yml
    - name: zmk-ext-power-smart-idle
      remote: frosthaven
      revision: main
    - name: zmk-driver-azoteq-iqs5xx
      remote: frosthaven
      # Pinned to an exact commit (not the 'gestures' branch): the CI caches west
      # modules keyed on west.yml's hash and runs `west update --fetch smart`, so
      # pushing new branch commits without changing this file would silently
      # reuse a stale cached checkout. Bump this SHA on every driver change.
      # d412c57: cursor uses a fractional accumulator so slow precision motion
      # isn't lost to integer rounding at scale<100; cursor-scale-percent now
      # applies to scroll as well; tap-then-hold engage window tightened
      # 250ms -> 200ms. Earlier ddda9f8: tap-then-hold drag-lock engagement
      # (1-finger tap arms the next single-finger touch-down to latch the left
      # button instantly, no chip press-and-hold-time wait).
      revision: d412c573ef7b30187beb4f2898766e68588f996b
    - name: cirque-input-module
      remote: frosthaven
      # Pinned to our fork at an exact commit. Includes petejohanson's
      # feat/idle-waker-wake-from-sleep-fixes (Cirque PM device action so the
      # trackpad recovers cleanly when the SoC wakes from CONFIG_ZMK_SLEEP).
      revision: c9d41b4dc74b898b53fb1643f38823c0c5f8ee19
  self:
    path: config
