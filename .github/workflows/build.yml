name: Build ZMK firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

  release:
    name: Draft Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create per-layout zips
        run: |
          mkdir -p release

          # Sort .uf2 files into per-layout staging dirs, grouped by trackpad
          # scenario. The trackpad scenario decides which half pair you flash:
          #   no trackpads/             standard_{left,right}
          #   trackpad on peripheral/   trackpad_peripheral_{left,right}
          #   trackpad on central/      trackpad_central_{left,right}
          # A trackpad on the peripheral forwards input to the central over the
          # split link, so BOTH halves in a folder must be flashed together.
          for file in artifacts/firmware/*.uf2; do
            [ -f "$file" ] || continue
            base=$(basename "$file")
            case "$base" in
              standard_left_corne_eclipse_*|standard_right_corne_eclipse_*)
                scenario="no trackpads"
                layout=$(echo "$base" | sed -E 's/^standard_(left|right)_corne_eclipse_//;s/\.zmk\.uf2$//')
                ;;
              trackpad_peripheral_left_corne_eclipse_*|trackpad_peripheral_right_corne_eclipse_*)
                scenario="trackpad on peripheral side"
                layout=$(echo "$base" | sed -E 's/^trackpad_peripheral_(left|right)_corne_eclipse_//;s/\.zmk\.uf2$//')
                ;;
              trackpad_central_left_corne_eclipse_*|trackpad_central_right_corne_eclipse_*)
                scenario="trackpad on central side"
                layout=$(echo "$base" | sed -E 's/^trackpad_central_(left|right)_corne_eclipse_//;s/\.zmk\.uf2$//')
                ;;
              left_corne_eclipse_rgb_while_building*|right_corne_eclipse_rgb_while_building*)
                # dev tool: its own zip, no scenario folders
                mkdir -p "staging/rgb_while_building"
                cp "$file" "staging/rgb_while_building/"
                continue
                ;;
              *)
                echo "WARN: unrecognized artifact '$base' - skipping"
                continue
                ;;
            esac
            mkdir -p "staging/$layout/$scenario"
            cp "$file" "staging/$layout/$scenario/"
          done

          # Zip each layout, preserving the scenario subfolders and dropping
          # settings_reset at the zip root. The rgb_while_building bundle uses a
          # leading-underscore name so it sorts to the top of the release page.
          if [ -d staging ]; then
            for layout_dir in staging/*/; do
              layout=$(basename "$layout_dir")
              cp assets/references/settings_reset-nice_nano_v2-zmk.uf2 "$layout_dir"
              if [ "$layout" = "rgb_while_building" ]; then
                zip_name="_rgb_while_building_corne_eclipse.zip"
              else
                zip_name="corne_eclipse_${layout}.zip"
              fi
              ( cd "$layout_dir" && zip -r "$GITHUB_WORKSPACE/release/${zip_name}" . )
            done
          fi

          echo "Release contents:"
          ls -la release/

      - name: Generate release notes
        id: notes
        run: |
          # Get the latest release tag (if any)
          LAST_TAG=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")

          if [ -n "$LAST_TAG" ] && git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"- [%h](https://github.com/${{ github.repository }}/commit/%H) %s" --)
          else
            COMMITS=$(git log --pretty=format:"- [%h](https://github.com/${{ github.repository }}/commit/%H) %s" --)
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- No new commits since last release"
          fi

          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "commits<<$EOF_MARKER" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "$EOF_MARKER" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: build-${{ github.run_number }}
          name: Firmware Build ${{ github.run_number }}
          files: release/*
          body: |
            ${{ steps.notes.outputs.commits }}

            ---

            Each zip is organized by trackpad scenario:

            - **no trackpads/** - standard left + right (no pointing device)
            - **trackpad on peripheral side/** - flash this pair if your trackpad is on the peripheral (right) half
            - **trackpad on central side/** - flash this pair if your trackpad is on the central (left) half

            Pick the folder for your build and flash **both** halves from it (a peripheral-side trackpad forwards input to the central, so the halves must match). `settings_reset-nice_nano_v2-zmk.uf2` is included for clean-slate flashing. Follow the [flashing guide](https://github.com/${{ github.repository }}/blob/main/FLASHING.md) and the [trackpad wiring guide](https://github.com/${{ github.repository }}/blob/main/WIRING_TRACKPAD.md).

            You can customize your keymap using [ZMK Studio](https://github.com/${{ github.repository }}/blob/main/KEYMAP.md#zmk-studio).

            Keymap Images:
            - [Typing Layers](https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/assets/images/samurai-legend-typing.png)
            - [Utility Layers](https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/assets/images/samurai-legend-utility.png)
