---
# Each layout produces 6 builds, grouped by trackpad scenario. The split
# central is the LEFT half, the peripheral is the RIGHT half. A trackpad on
# the peripheral forwards its input to the central over the split link
# (zmk,input-split), so BOTH halves must be flashed as a coordinated pair.
# The release workflow sorts these into scenario folders inside each zip:
#
#   no trackpads/            standard_left            + standard_right
#   trackpad on peripheral/  trackpad_peripheral_left + trackpad_peripheral_right
#   trackpad on central/     trackpad_central_left    + trackpad_central_right
#
# Per scenario:
#   standard_*            display on both, no pointing device.
#   trackpad_peripheral_  right = trackpad HW (no display, forwards); left =
#                         central with display + input-split receiver.
#   trackpad_central_     left = trackpad HW (no display, direct listener +
#                         publishes status); right = display peripheral that
#                         renders the relocated central status.
# Plus one dev rgb_while_building pair (QWERTY, RGB on at boot, no trackpad).

include:
  # ===================== Colemak-DH =====================
  - board: nice_nano_v2
    shield: corne_eclipse_left eclipse_nice_view_adapter_trrs nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: standard_left_corne_eclipse_colemak_dh.zmk
  - board: nice_nano_v2
    shield: corne_eclipse_right eclipse_nice_view_adapter_trrs nice_view
    artifact-name: standard_right_corne_eclipse_colemak_dh.zmk
  - board: nice_nano_v2
    shield: corne_eclipse_left eclipse_nice_view_adapter_trrs nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DDTS_EXTRA_CPPFLAGS="-DTRACKPAD_PERIPHERAL=1"
    artifact-name: trackpad_peripheral_left_corne_eclipse_colemak_dh.zmk
  - board: nice_nano_v2
    shield: corne_eclipse_right
    cmake-args: -DCONFIG_INPUT_AZOTEQ_IQS5XX=y -DCONFIG_INPUT_PINNACLE=y -DCONFIG_I2C=y -DCONFIG_ZMK_DISPLAY=n -DDTS_EXTRA_CPPFLAGS="-DTRACKPAD_PERIPHERAL=1"
    artifact-name: trackpad_peripheral_right_corne_eclipse_colemak_dh.zmk
  - board: nice_nano_v2
    shield: corne_eclipse_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_INPUT_AZOTEQ_IQS5XX=y -DCONFIG_INPUT_PINNACLE=y -DCONFIG_I2C=y -DCONFIG_ZMK_DISPLAY=n -DCONFIG_ZMK_SPLIT_CENTRAL_STATUS_MIRROR=y -DDTS_EXTRA_CPPFLAGS="-DTRACKPAD_CENTRAL=1"
    artifact-name: trackpad_central_left_corne_eclipse_colemak_dh.zmk
  - board: nice_nano_v2
    shield: corne_eclipse_right eclipse_nice_view_adapter_trrs nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT_CENTRAL_STATUS_MIRROR=y -DDTS_EXTRA_CPPFLAGS="-DTRACKPAD_CENTRAL=1"
    artifact-name: trackpad_central_right_corne_eclipse_colemak_dh.zmk

